<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS + CSS Clock</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>


    <div class="clock">
      <div class="clock-face">
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>


  <style>
    html {
      background: #018DED url(https://unsplash.it/1500/1000?image=881&blur=5);
      background-size: cover;
      font-family: 'helvetica neue';
      text-align: center;
      font-size: 10px;
    }

    body {
      margin: 0;
      font-size: 2rem;
      display: flex;
      flex: 1;
      min-height: 100vh;
      align-items: center;
    }

    .clock {
      width: 30rem;
      height: 30rem;
      border: 20px solid white;
      border-radius: 50%;
      margin: 50px auto;
      position: relative;
      padding: 2rem;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.1),
        inset 0 0 0 3px #EFEFEF,
        inset 0 0 10px black,
        0 0 10px rgba(0,0,0,0.2);
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateY(-3px); /* account for the height of the clock hands */
    }

    .hand {
      width: 50%;
      height: 6px;
      background: black;
      position: absolute;
      top: 50%;
      rotate: 90deg; /* rotate 90 degrees by default so it starts at 12 oclock */
      transform-origin: right;
    }

  </style>

  <script>

    // get time 
    const now = new Date()
    let hours = now.getHours() // use let for hours so we can overwrite it to get 12 hour format
    if (hours > 12) { // converts 13 hours into 1 hours for clock face. 
      hours = hours - 12 
    }
    const minutes = now.getMinutes()
    const seconds = now.getSeconds()

    // calculate degrees from hours/minutes/seconds and assign 
    const hourHandDeg = (hours/12)*360 // hour hand will only be precise to the hour (i.e. will show exactly 9, even if it's 9:30)
    const minuteHandDeg = (minutes/60)*360
    const secondHandDeg = (seconds/60)*360
    
    // assign our elements using their css classes to local variables (they end with El, signifying they're an element)
    const hourHandEl = document.querySelector(".hour-hand") 
    const minuteHandEl = document.querySelector(".min-hand")
    const secondHandEl = document.querySelector(".second-hand")

    // check degrees in console that its correct 
    console.log(hourHandDeg)
    console.log(minuteHandDeg)
    console.log(secondHandDeg)

    // map our degrees to our hand elements
    hourHandEl.style.transform = `rotate(${hourHandDeg}deg)` // backticks and ${} are like python's f-strings. 
    minuteHandEl.style.transform = `rotate(${minuteHandDeg}deg)`
    secondHandEl.style.transform = `rotate(${secondHandDeg}deg)`

  </script>
</body>
</html>
