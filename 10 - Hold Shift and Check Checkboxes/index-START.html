<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hold Shift to Check Multiple Checkboxes</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <style>

    html {
      font-family: sans-serif;
      background: #ffc600;
    }

    .inbox {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      border-radius: 5px;
      box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
    }

    .item {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #F1F1F1;
    }

    .item:last-child {
      border-bottom: 0;
    }

    input:checked + p {
      background: #F9F9F9;
      text-decoration: line-through;
    }

    input[type="checkbox"] {
      margin: 20px;
    }

    p {
      margin: 0;
      padding: 20px;
      transition: background 0.2s;
      flex: 1;
      font-family:'helvetica neue';
      font-size: 20px;
      font-weight: 200;
      border-left: 1px solid #D1E2FF;
    }
  </style>
   <!--
   The following is a common layout you would see in an email client.

   When a user clicks a checkbox, holds Shift, and then clicks another checkbox a few rows down, all the checkboxes inbetween those two checkboxes should be checked.

  -->
  <div class="inbox">
    <div class="item">
      <input type="checkbox">
      <p>This is an inbox layout.</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Check one item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Hold down your Shift key</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Check a lower item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Everything in between should also be set to checked</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Try to do it without any libraries</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Just regular JavaScript</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Good Luck!</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Don't forget to tweet your result!</p>
    </div>
  </div>

<script>

  const checkboxes = document.querySelectorAll(".item input") // get checkbox elements as a nodeList
  // console.dir(checkboxes[0]) // find out how to get value from checkbox

  let shiftKeyPressed = false
  window.addEventListener("keydown", (e) => {if (e.shiftKey) {shiftKeyPressed = true} else {shiftKeyPressed = false}})
  window.addEventListener("keyup", (e) => {if (e.shiftKey) {shiftKeyPressed = true} else {shiftKeyPressed = false}})
  checkboxes.forEach((checkbox) => {
    checkbox.addEventListener("change", fillCheckboxes)
  })


  console.log(checkboxes)

  function fillCheckboxes(e) {
    console.log(e.shiftKey)
    if (shiftKeyPressed) {
      // get the values of each checkbox in an array. Updates with each checkbox change
      const checkboxValues = Array.from(checkboxes).map((checkbox) => (checkbox.checked))
      console.log(checkboxValues)

      // gets the index position in the array of the first and last checked checkbox (where checked === true)
      let firstCheckbox = checkboxValues.findIndex((checkbox) => checkbox === true)
      let lastCheckbox = checkboxValues.findLastIndex((checkbox) => checkbox === true)
      // console.log(firstCheckbox)
      // console.log(lastCheckbox)

      // loop through each position between the index position of the two checkboxes, and check them. 
      for (let step = firstCheckbox+1; step < lastCheckbox; step++) {
        console.log(step)
        checkboxes[step].checked = true
      }
    } else {
      console.info("Shift key not pressed")
    }

  }



  
  console.log(checkboxes)

</script>
</body>
</html>
